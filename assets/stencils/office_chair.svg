<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Office Swivel Chair Top-Down View -->
  <!-- 5-Star Caster Base (Underneath) -->
  <g stroke="#9CA3AF" stroke-width="3" stroke-linecap="round">
    <line x1="50" y1="50" x2="50" y2="82"/>
    <line x1="50" y1="50" x2="80" y2="60"/>
    <line x1="50" y1="50" x2="69" y2="24"/>
    <line x1="50" y1="50" x2="31" y2="24"/>
    <line x1="50" y1="50" x2="20" y2="60"/>
  </g>
  <circle cx="50" cy="50" r="4" fill="#4B5563"/>
  <circle cx="50" cy="82" r="2.5" fill="#374151"/>
  <circle cx="80" cy="60" r="2.5" fill="#374151"/>
  <circle cx="69" cy="24" r="2.5" fill="#374151"/>
  <circle cx="31" cy="24" r="2.5" fill="#374151"/>
  <circle cx="20" cy="60" r="2.5" fill="#374151"/>
  <!-- Seat Cushion -->
  <rect x="27" y="32" width="46" height="40" rx="12" fill="#E5E7EB" stroke="#374151" stroke-width="2.5"/>
  <!-- Armrests -->
  <rect x="19" y="38" width="7" height="28" rx="3.5" fill="#374151" stroke="#1F2937" stroke-width="1.5"/>
  <rect x="74" y="38" width="7" height="28" rx="3.5" fill="#374151" stroke="#1F2937" stroke-width="1.5"/>
  <!-- Backrest (Curved Top Cushion) -->
  <path d="M 23 28 Q 50 16 77 28 Q 50 22 23 28 Z" fill="#4B5563" stroke="#1F2937" stroke-width="2"/>
</svg>
