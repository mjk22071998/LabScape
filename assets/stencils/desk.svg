<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 70" width="120" height="70">
  <!-- Standard Office Desk Top-Down View -->
  <!-- Main Desktop Surface (Rectangle with subtle rounded corners) -->
  <rect x="10" y="10" width="100" height="50" rx="3" fill="#F3F4F6" stroke="#374151" stroke-width="2"/>
  
  <!-- Desk Frame / Under-desk Leg Support Lines (Top and Bottom edges) -->
  <line x1="14" y1="14" x2="106" y2="14" stroke="#D1D5DB" stroke-width="1.5"/>
  <line x1="14" y1="56" x2="106" y2="56" stroke="#D1D5DB" stroke-width="1.5"/>

  <!-- Left Drawer Pedestal (Filing cabinet outline) -->
  <rect x="13" y="14" width="22" height="42" rx="2" fill="#E5E7EB" stroke="#6B7280" stroke-width="1.5"/>
  <line x1="24" y1="20" x2="24" y2="50" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Desktop Cable Grommet (Round Cable Pass-through) -->
  <circle cx="95" cy="22" r="3.5" fill="#374151" stroke="#1F2937" stroke-width="1"/>
  <circle cx="95" cy="22" r="1.5" fill="#111827"/>
</svg>
