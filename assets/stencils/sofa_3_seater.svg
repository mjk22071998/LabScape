<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" width="160" height="80">
  <!-- 3-Seater Sofa Top-Down View -->
  <!-- Main Frame Outline -->
  <rect x="10" y="10" width="140" height="60" rx="8" fill="#E5E7EB" stroke="#374151" stroke-width="2.5"/>

  <!-- Backrest Cushion (Full Width) -->
  <rect x="14" y="14" width="132" height="18" rx="5" fill="#D1D5DB" stroke="#4B5563" stroke-width="1.5"/>
  <!-- Tufting / Seam lines on backrest -->
  <line x1="58" y1="14" x2="58" y2="32" stroke="#9CA3AF" stroke-width="1.5"/>
  <line x1="102" y1="14" x2="102" y2="32" stroke="#9CA3AF" stroke-width="1.5"/>

  <!-- Left Armrest -->
  <rect x="14" y="28" width="16" height="38" rx="5" fill="#D1D5DB" stroke="#4B5563" stroke-width="1.5"/>

  <!-- Right Armrest -->
  <rect x="130" y="28" width="16" height="38" rx="5" fill="#D1D5DB" stroke="#4B5563" stroke-width="1.5"/>

  <!-- 3 Seat Cushions -->
  <!-- Cushion 1 -->
  <rect x="33" y="34" width="30" height="32" rx="4" fill="#F3F4F6" stroke="#4B5563" stroke-width="1.5"/>
  <!-- Cushion 2 -->
  <rect x="65" y="34" width="30" height="32" rx="4" fill="#F3F4F6" stroke="#4B5563" stroke-width="1.5"/>
  <!-- Cushion 3 -->
  <rect x="97" y="34" width="30" height="32" rx="4" fill="#F3F4F6" stroke="#4B5563" stroke-width="1.5"/>
</svg>
