<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Laptop Top-Down View -->
  <!-- Base Chassis -->
  <rect x="16" y="22" width="68" height="56" rx="5" fill="#E5E7EB" stroke="#374151" stroke-width="2.5"/>
  <!-- Display Hinge Bar -->
  <rect x="18" y="23" width="64" height="5" rx="1.5" fill="#1F2937"/>
  <!-- Keyboard Tray -->
  <rect x="22" y="32" width="56" height="26" rx="3" fill="#D1D5DB" stroke="#4B5563" stroke-width="1.5"/>
  <!-- Key rows simulation -->
  <line x1="26" y1="37" x2="74" y2="37" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="26" y1="43" x2="74" y2="43" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="26" y1="49" x2="74" y2="49" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="4,2"/>
  <rect x="36" y="53" width="28" height="3" rx="1" fill="#4B5563"/>
  <!-- Trackpad -->
  <rect x="38" y="62" width="24" height="13" rx="2.5" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
</svg>
