<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" width="200" height="100">
  <!-- Conference Table 8-Seater Top-Down View -->
  
  <!-- 8 Chairs -->
  <!-- Top 3 Chairs -->
  <g fill="#D1D5DB" stroke="#4B5563" stroke-width="1.5">
    <!-- Chair 1 -->
    <path d="M 52 14 A 9 9 0 0 1 68 14 L 68 18 A 9 9 0 0 1 52 18 Z"/>
    <path d="M 50 12 Q 60 7 70 12" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Chair 2 -->
    <path d="M 92 14 A 9 9 0 0 1 108 14 L 108 18 A 9 9 0 0 1 92 18 Z"/>
    <path d="M 90 12 Q 100 7 110 12" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Chair 3 -->
    <path d="M 132 14 A 9 9 0 0 1 148 14 L 148 18 A 9 9 0 0 1 132 18 Z"/>
    <path d="M 130 12 Q 140 7 150 12" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Bottom 3 Chairs -->
    <!-- Chair 4 -->
    <path d="M 52 82 A 9 9 0 0 0 68 82 L 68 86 A 9 9 0 0 0 52 86 Z"/>
    <path d="M 50 88 Q 60 93 70 88" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Chair 5 -->
    <path d="M 92 82 A 9 9 0 0 0 108 82 L 108 86 A 9 9 0 0 0 92 86 Z"/>
    <path d="M 90 88 Q 100 93 110 88" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Chair 6 -->
    <path d="M 132 82 A 9 9 0 0 0 148 82 L 148 86 A 9 9 0 0 0 132 86 Z"/>
    <path d="M 130 88 Q 140 93 150 88" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Left End Chair (Rotated 90 deg) -->
    <path d="M 14 42 A 9 9 0 0 1 14 58 L 18 58 A 9 9 0 0 1 18 42 Z"/>
    <path d="M 12 40 Q 7 50 12 60" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Right End Chair (Rotated -90 deg) -->
    <path d="M 182 42 A 9 9 0 0 0 182 58 L 186 58 A 9 9 0 0 0 186 42 Z"/>
    <path d="M 188 40 Q 193 50 188 60" fill="none" stroke="#374151" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Conference Table Surface (Boat / Rounded Rectangle) -->
  <rect x="30" y="22" width="140" height="56" rx="14" fill="#F3F4F6" stroke="#374151" stroke-width="2.5"/>
  
  <!-- Center AV / Connectivity Module -->
  <rect x="80" y="44" width="40" height="12" rx="3" fill="#E5E7EB" stroke="#6B7280" stroke-width="1.5"/>
  <circle cx="90" cy="50" r="2" fill="#3B82F6"/>
  <circle cx="100" cy="50" r="2" fill="#10B981"/>
  <circle cx="110" cy="50" r="2" fill="#374151"/>
</svg>
