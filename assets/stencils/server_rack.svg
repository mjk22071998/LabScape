<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Server Rack Cabinet Top-Down / Overhead View -->
  <!-- Outer Rack Cabinet Shell -->
  <rect x="18" y="10" width="64" height="80" rx="4" fill="#1F2937" stroke="#111827" stroke-width="2.5"/>
  <!-- Front Perforated Door Frame (Top) -->
  <rect x="22" y="12" width="56" height="8" rx="2" fill="#374151" stroke="#4B5563" stroke-width="1.5"/>
  <line x1="26" y1="16" x2="74" y2="16" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="2,2"/>
  <!-- Front Door Handle -->
  <rect x="46" y="8" width="8" height="4" rx="1" fill="#D1D5DB"/>
  
  <!-- Rear Perforated Door Frame (Bottom) -->
  <rect x="22" y="80" width="56" height="8" rx="2" fill="#374151" stroke="#4B5563" stroke-width="1.5"/>
  <line x1="26" y1="84" x2="74" y2="84" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="2,2"/>

  <!-- 19-inch Mounting Rails (4 Corner Posts) -->
  <rect x="23" y="24" width="6" height="6" fill="#D1D5DB" stroke="#111827" stroke-width="1"/>
  <rect x="71" y="24" width="6" height="6" fill="#D1D5DB" stroke="#111827" stroke-width="1"/>
  <rect x="23" y="70" width="6" height="6" fill="#D1D5DB" stroke="#111827" stroke-width="1"/>
  <rect x="71" y="70" width="6" height="6" fill="#D1D5DB" stroke="#111827" stroke-width="1"/>

  <!-- Server Chassis Slices (Chassis Unit Lines) -->
  <rect x="27" y="26" width="46" height="48" fill="#111827" stroke="#4B5563" stroke-width="1.5"/>
  <line x1="27" y1="34" x2="73" y2="34" stroke="#374151" stroke-width="1.5"/>
  <line x1="27" y1="42" x2="73" y2="42" stroke="#374151" stroke-width="1.5"/>
  <line x1="27" y1="50" x2="73" y2="50" stroke="#374151" stroke-width="1.5"/>
  <line x1="27" y1="58" x2="73" y2="58" stroke="#374151" stroke-width="1.5"/>
  <line x1="27" y1="66" x2="73" y2="66" stroke="#374151" stroke-width="1.5"/>

  <!-- Power & Status LEDs on front rack rail -->
  <circle cx="31" cy="30" r="1.5" fill="#10B981"/>
  <circle cx="36" cy="30" r="1.5" fill="#3B82F6"/>
  <circle cx="31" cy="38" r="1.5" fill="#10B981"/>
  <circle cx="36" cy="38" r="1.5" fill="#10B981"/>
</svg>
