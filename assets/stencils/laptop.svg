<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Laptop with Screen Tilted Back (Top-Down 3/4 Projection) -->
  
  <!-- Tilted Back Screen (Angled backwards from hinge) -->
  <polygon points="20,12 80,12 76,36 24,36" fill="#1F2937" stroke="#111827" stroke-width="2"/>
  <!-- Display Panel Area (Reflective glass surface facing slightly up) -->
  <polygon points="23,15 77,15 73,34 27,34" fill="#374151" stroke="#4B5563" stroke-width="1"/>
  <!-- Subtle screen glare line -->
  <line x1="32" y1="18" x2="68" y2="30" stroke="#60A5FA" stroke-width="1" opacity="0.6"/>

  <!-- Hinge Bar -->
  <rect x="22" y="34" width="56" height="5" rx="1.5" fill="#111827" stroke="#374151" stroke-width="1"/>

  <!-- Base / Keyboard Chassis -->
  <rect x="18" y="38" width="64" height="48" rx="4" fill="#E5E7EB" stroke="#374151" stroke-width="2"/>
  
  <!-- Keyboard Inset -->
  <rect x="22" y="44" width="56" height="22" rx="2" fill="#D1D5DB" stroke="#6B7280" stroke-width="1"/>
  <line x1="26" y1="48" x2="74" y2="48" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="26" y1="53" x2="74" y2="53" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="26" y1="58" x2="74" y2="58" stroke="#4B5563" stroke-width="1.5" stroke-dasharray="4,2"/>
  <rect x="36" y="62" width="28" height="2.5" rx="1" fill="#4B5563"/>

  <!-- Trackpad -->
  <rect x="38" y="69" width="24" height="13" rx="2" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1"/>
</svg>
