<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Desktop PC Top-Down View -->
  <!-- Monitor Base / Stand -->
  <rect x="38" y="24" width="24" height="12" rx="3" fill="#9CA3AF" stroke="#374151" stroke-width="2"/>
  <rect x="46" y="20" width="8" height="6" fill="#4B5563"/>
  <!-- Curved/Wide Monitor -->
  <path d="M 12 18 Q 50 14 88 18 L 88 22 Q 50 18 12 22 Z" fill="#1F2937" stroke="#111827" stroke-width="1.5"/>
  <!-- Keyboard -->
  <rect x="18" y="44" width="46" height="20" rx="3" fill="#E5E7EB" stroke="#374151" stroke-width="2"/>
  <!-- Key rows -->
  <line x1="22" y1="50" x2="60" y2="50" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="22" y1="55" x2="60" y2="55" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="3,2"/>
  <rect x="30" y="59" width="22" height="2.5" rx="1" fill="#9CA3AF"/>
  <!-- Mouse -->
  <rect x="69" y="48" width="9" height="14" rx="4.5" fill="#E5E7EB" stroke="#374151" stroke-width="1.5"/>
  <line x1="73.5" y1="48" x2="73.5" y2="54" stroke="#9CA3AF" stroke-width="1"/>
  <!-- PC Tower Chassis (Side View) -->
  <rect x="18" y="72" width="50" height="14" rx="2" fill="#374151" stroke="#1F2937" stroke-width="2"/>
  <circle cx="23" cy="79" r="2" fill="#10B981"/>
  <line x1="30" y1="76" x2="62" y2="76" stroke="#6B7280" stroke-width="1.5"/>
  <line x1="30" y1="82" x2="62" y2="82" stroke="#6B7280" stroke-width="1.5"/>
</svg>
